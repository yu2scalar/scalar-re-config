apiVersion: apps/v1
kind: Deployment
metadata:
  name: scalar-re
  namespace: scalar-re
  labels:
    app: scalar-re
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: scalar-re
  template:
    metadata:
      labels:
        app: scalar-re
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Graceful shutdown (scalar-re backlog §2.51): preStop sleep (10 s) + RE's drain delay
      # (scalar-re.shutdown.drain-delay-ms, 5 s) + in-flight wait (inflight-timeout-ms, 20 s) +
      # the web server's graceful shutdown (up to 30 s) + margin
      terminationGracePeriodSeconds: 75
      imagePullSecrets:
      - name: ghcr-pull
      containers:
      - name: scalar-re
        image: ghcr.io/yu2scalar/scalar-re:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: scalar-re-credentials
        volumeMounts:
        - name: config
          mountPath: /app/scalar-re-config.yml
          subPath: scalar-re-config.yml
          readOnly: true
        lifecycle:
          preStop:
            # Keep serving while the endpoints removal reaches kube-proxy / the load balancer;
            # SIGTERM (and RE's graceful shutdown) follows. exec + sleep works on any Kubernetes
            # version (the image is alpine); on 1.30+ `sleep: {seconds: 10}` is equivalent.
            exec:
              command: ["sleep", "10"]
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 4
        readinessProbe:
          httpGet:
            # goes DOWN as soon as a graceful shutdown starts (scalar-re backlog §2.51)
            path: /actuator/health/readiness
            port: http
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 2Gi
      volumes:
      - name: config
        configMap:
          name: scalar-re-config
